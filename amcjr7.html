<!DOCTYPE html>

    <!-- Font Awesome untuk Ikon Sosial Media -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            text-align: center;
            padding: 20px 10px;
        }

        /* Profile Styling */
        .profile {
            margin-bottom: 30px;
        }

        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #38bdf8;
            box-shadow: 0 4px 20px rgba(56, 189, 248, 0.3);
            margin-bottom: 15px;
        }

        .profile h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .profile p {
            font-size: 0.9rem;
            color: #94a3b8;
        }

        /* Links Styling */
        .links {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .link-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
            text-decoration: none;
            padding: 16px 20px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .link-card:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-3px);
            border-color: #38bdf8;
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.2);
        }

        .link-card i {
            font-size: 1.4rem;
            width: 30px;
            text-align: left;
        }

        .link-text {
            flex-grow: 1;
            text-align: center;
        }

        .arrow-icon {
            font-size: 0.9rem !important;
            width: auto !important;
            opacity: 0.5;
        }

        /* Custom Colors for Icons */
        .capcut-color { color: #ffffff; }
        .facebook-color { color: #1877f2; }
        .tiktok-color { color: #ff0050; }
        .telegram-color { color: #24a1de; }
        .x-color { color: #ffffff; }
        .instagram-color { color: #e1306c; }
        .whatsapp-color { color: #25d366; }

        /* Footer Styling */
        footer {
            margin-top: 40px;
            font-size: 0.8rem;
            color: #64748b;
        }
    </style>
</head>
