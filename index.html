            border-radius: 50%;
            z-index: -1;
            filter: blur(15px);

        @keyframes pulse-glow {

            100% { opacity: 0.9; filter: blur(20px); }
        }

        /* Animated Gradient Text for Title */
        .animate-gradient-text {
            background: linear-gradient(270deg, #00f2fe, #4facfe, #f093fb, #f5576c, #00f2fe);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            color: transparent;
            animation: gradientMove 6s ease infinite;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Entrance Animation */
        .fade-in-up {
            animation: fadeInUp 0.8s cubic-bezier(0.23, 1, 0.32, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.3s; }
        .delay-4 { animation-delay: 0.4s; }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

    <script>
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let drops = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initAnimation();
        }

        window.addEventListener('resize', resize);

        class MatrixDrop {
            constructor(x) {
                this.x = x;
                this.reset(true);
            }

            reset(isInit = false) {
                this.y = isInit ? Math.random() * height : -Math.random() * 200 - 50;
                this.speed = Math.random() * 1.5 + 0.8; // Slow motion santai
                this.length = Math.random() * 100 + 60;
                this.opacity = Math.random() * 0.5 + 0.2;
            }

            update() {
                this.y += this.speed;
                if (this.y - this.length > height) {
                    this.reset();
                }
            }

            draw() {
                let grad = ctx.createLinearGradient(this.x, this.y - this.length, this.x, this.y);
                grad.addColorStop(0, 'rgba(5, 5, 5, 0)');
                grad.addColorStop(1, `rgba(167, 139, 250, ${this.opacity})`);

                ctx.beginPath();
                ctx.moveTo(this.x, this.y - this.length);
                ctx.lineTo(this.x, this.y);
                ctx.strokeStyle = grad;
                ctx.lineWidth = 1.5;
                ctx.lineCap = 'round';
                ctx.stroke();

                // Kepala titik putih terang
                ctx.beginPath();
                ctx.arc(this.x, this.y, 1.5, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.shadowBlur = 8;
                ctx.shadowColor = '#ffffff';
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        function initAnimation() {
            drops = [];
            let columnSpacing = (width < 768) ? 40 : 55; 
            let columns = Math.floor(width / columnSpacing);
            
            for (let i = 0; i < columns; i++) {
                let x = (i * columnSpacing) + (columnSpacing / 2);
                drops.push(new MatrixDrop(x));
            }
        }

        function animate() {
            ctx.fillStyle = 'rgba(5, 5, 5, 0.2)';
            ctx.fillRect(0, 0, width, height);

            for (let drop of drops) {
                drop.update();
                drop.draw();
            }
            requestAnimationFrame(animate);
        }

        resize();
        animate();
    </script>
